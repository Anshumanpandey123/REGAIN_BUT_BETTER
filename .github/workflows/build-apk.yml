name: Build Personal Regain Pro APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Scaffold Android Project Structure Automatically
        run: |
          mkdir -p app/src/main/java/com/regain/pro
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cp MainActivity.kt app/src/main/java/com/regain/pro/MainActivity.kt
          cp RegainBlockerService.kt app/src/main/java/com/regain/pro/RegainBlockerService.kt

          # Copy true PNG mipmap icons & drawable
          if [ -d res ]; then
            cp -r res/* app/src/main/res/
          fi
          if [ -f logo.png ]; then
            cp logo.png app/src/main/res/drawable/logo.png
          fi

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "RegainPersonalPro"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          # Generate dedicated RSA-2048 production signing keystore
          keytool -genkey -v -keystore app/release.jks -alias regainpro -keyalg RSA -keysize 2048 -validity 10000 -storepass regainpro2026 -keypass regainpro2026 -dname "CN=Regain Pro, OU=Digital Wellness, O=Regain Inc, L=San Francisco, ST=California, C=US"

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.regain.pro'
              compileSdk 34

              defaultConfig {
                  applicationId "com.regain.pro"
                  minSdk 24
                  targetSdk 34
                  versionCode 3
                  versionName "1.0.2-PRO"
              }

              signingConfigs {
                  release {
                      storeFile file('release.jks')
                      storePassword 'regainpro2026'
                      keyAlias 'regainpro'
                      keyPassword 'regainpro2026'
                      v1SigningEnabled true
                      v2SigningEnabled true
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
                  debug {
                      applicationIdSuffix ""
                      debuggable true
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          # Accessibility Service Configuration targeting distracting apps and browsers
          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault"
              android:canRetrieveWindowContent="true"
              android:description="@string/accessibility_service_description"
              android:notificationTimeout="100"
              android:packageNames="com.google.android.youtube,com.instagram.android,com.facebook.katana,com.facebook.orca,com.facebook.lite,com.snapchat.android,com.zhiliaoapp.musically,com.ss.android.ugc.trill,com.twitter.android,com.twitter.android.lite,com.reddit.frontpage,com.android.chrome,org.mozilla.firefox,com.opera.browser,com.brave.browser,com.microsoft.emmx,com.netflix.mediaclient,com.amazon.avod.thirdpartyclient,tv.twitch.android.app,com.discord,com.pinterest,com.whatsapp,com.android.settings,com.google.android.packageinstaller" />
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Regain Pro</string>
              <string name="accessibility_service_description">Regain Pro intelligent anti-distraction shield. Enforces reels/shorts blocking, study limits, and app focus timers.</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/colors.xml
          <resources>
              <color name="bg_dark">#0A0E0A</color>
              <color name="accent_green">#5CE63C</color>
              <color name="gold_pro">#E8B931</color>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <resources>
              <style name="Theme.RegainPro" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:statusBarColor">#0A0E0A</item>
                  <item name="android:navigationBarColor">#0A0E0A</item>
                  <item name="android:windowBackground">#0A0E0A</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools"
              package="com.regain.pro">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.PACKAGE_USAGE_STATS"
                  tools:ignore="ProtectedPermissions" />

              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.RegainPro">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <!-- Deep link for Supabase Google OAuth callback -->
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="regainpro" android:host="auth-callback" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".RegainBlockerService"
                      android:exported="false"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF

      - name: Build Android Release APK
        run: gradle assembleRelease --stacktrace

      - name: Rename Release APK
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Regain-Pro-v1.0.2.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Regain-Personal-Pro-APK
          path: app/build/outputs/apk/release/Regain-Pro-v1.0.2.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: "Regain Pro v1.0.2 — Full UI Overhaul & Strict App Restrictor"
          body: |
            ## 🦁 Regain Pro v1.0.2 Release

            ### What's New in this Build:
            - **Pixel-Perfect UI Redesign**: Accurately recreated from official Regain Pro interface screens (Focus, Schedule, Groups, Blocks).
            - **Strict App Restrictor**: Fixed focus sessions to strictly block YouTube, Chrome, Instagram, games, and all user-classified distracting apps with an un-bypassable alert popup.
            - **Integrated Digital Wellbeing**: Productive vs Distracting screen time breakdown with interactive daily focus ratio charts.
            - **Smart App Categorization**: Allows the user to classify any app as Distracting, Productive, or Neutral.
            - **Post-Login Permission Onboarding**: Guides the user through enabling Screen Time Access (Usage Access) & Regain Blocker (Accessibility).
            - **Brand App Icon**: Packaged with the official gold 'R' `logo.png` across all mipmap densities.
            - **Security & Privacy**: All API keys and Supabase credentials kept completely invisible.
          files: app/build/outputs/apk/release/Regain-Pro-v1.0.2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
